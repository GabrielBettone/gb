name: Temporary PR lockfile repair

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/repair-pr-lockfile.yml'

permissions:
  contents: write

jobs:
  repair-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the security PR branch
        uses: actions/checkout@v4
        with:
          ref: 'fix/patch-vulnerabilities-8707c8d5-1793457093'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate pnpm lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts

      - name: Commit lockfile to the security PR branch
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "No lockfile changes were generated; stopping to avoid an empty commit."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "fix: synchronize pnpm lockfile with security updates"
          git push origin "HEAD:fix/patch-vulnerabilities-8707c8d5-1793457093"
