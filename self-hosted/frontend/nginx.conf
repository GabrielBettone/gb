server {
    listen 80;
    server_name localhost;

    # Limite aumentado para upload de mídias e vídeos
    client_max_body_size 60M;

    # Compressão gzip para velocidade máxima
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Raiz dos arquivos estáticos compilados do front-end
    root /usr/share/nginx/html;
    index index.html;

    # Cache de arquivos estáticos versionados
    location ~* \.(?:css|js|woff2?|eot|ttf|otf|ico|svg|png|jpg|jpeg|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Roteamento SPA: Qualquer rota não encontrada entrega o index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
