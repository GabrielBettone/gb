services:
  # ----------------------------------------------------------------------------
  # Front-End (Web): Nginx servindo o React compilado com cliente Supabase
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ..
      dockerfile: self-hosted/frontend/Dockerfile
      args:
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
        - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
    container_name: bettone_frontend
    restart: unless-stopped
    ports:
      # Porta pública onde o site e o sistema ficarão acessíveis no VPS
      - '${APP_PORT:-80}:80'
