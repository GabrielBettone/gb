services:
  # ----------------------------------------------------------------------------
  # PocketBase: Banco de dados, autenticação, armazenamento e hooks
  # ----------------------------------------------------------------------------
  pocketbase:
    build:
      context: ./pocketbase
      dockerfile: Dockerfile
    container_name: bettone_pocketbase
    restart: unless-stopped
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com}
      - AI_API_KEY=${AI_API_KEY:-}
      - SIMULADOR_AI_KEY=${SIMULADOR_AI_KEY:-}
    volumes:
      # Persistência do banco de dados SQLite e uploads de arquivos
      - pb_data:/pb/pb_data
      # Migrações e hooks montados como volume (permite atualizar sem rebuild)
      - ./pocketbase/pb_migrations:/pb/pb_migrations:ro
      - ./pocketbase/pb_hooks:/pb/pb_hooks:ro
    ports:
      # Acesso direto opcional ao PocketBase na porta 8090
      - '${PB_PORT:-8090}:8090'
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:8090/api/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ----------------------------------------------------------------------------
  # Front-End (Web): Nginx servindo o React compilado + Proxy Reverso integrado
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ..
      dockerfile: self-hosted/frontend/Dockerfile
      args:
        - VITE_POCKETBASE_URL=${VITE_POCKETBASE_URL:-}
    container_name: bettone_frontend
    restart: unless-stopped
    depends_on:
      pocketbase:
        condition: service_healthy
    ports:
      # Porta pública da aplicação (acesse http://seu-ip:APP_PORT ou http://seudominio.com.br)
      - '${APP_PORT:-80}:80'

volumes:
  pb_data:
    name: bettone_pb_data
